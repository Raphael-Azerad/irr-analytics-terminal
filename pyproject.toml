[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "irr-analytics-terminal"
version = "1.0.0"
description = "Investment cash-flow analysis and capital budgeting dashboard"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.35,<2.0",
  "pandas>=2.1,<3.0",
  "numpy>=1.26,<3.0",
  "plotly>=5.20,<7.0",
  "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.5,<1.0", "black>=24.0,<26.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
