<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">IRR Analytics Terminal project comparison</title>
  <desc id="desc">Preview of the multi-project comparison tab with ranking bars and finance metrics.</desc>
  <rect width="1200" height="675" fill="#08111f"/>
  <rect x="34" y="34" width="1132" height="607" rx="22" fill="#0b1726" stroke="#1d3048" stroke-width="2"/>
  <text x="72" y="92" fill="#f3f8fc" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">Multi-Project Comparison</text>
  <text x="72" y="128" fill="#8fa5bd" font-family="Inter, Arial, sans-serif" font-size="18">Balanced ranking using NPV, IRR, payback, profitability index, and scale</text>
  <rect x="72" y="170" width="504" height="405" rx="14" fill="#101c2c" stroke="#1d3048"/>
  <text x="104" y="213" fill="#f3f8fc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Composite Ranking</text>
  <g font-family="Inter, Arial, sans-serif" font-size="16">
    <text x="104" y="275" fill="#dbe7f3">Corporate Expansion</text>
    <rect x="285" y="254" width="225" height="28" rx="6" fill="#28d7e5"/>
    <text x="528" y="275" fill="#f3f8fc" text-anchor="end">92</text>
    <text x="104" y="335" fill="#dbe7f3">Renewable Energy</text>
    <rect x="285" y="314" width="198" height="28" rx="6" fill="#7ee2b8"/>
    <text x="528" y="335" fill="#f3f8fc" text-anchor="end">81</text>
    <text x="104" y="395" fill="#dbe7f3">Real Estate Project</text>
    <rect x="285" y="374" width="170" height="28" rx="6" fill="#f5c96b"/>
    <text x="528" y="395" fill="#f3f8fc" text-anchor="end">69</text>
    <text x="104" y="455" fill="#dbe7f3">Acquisition Case</text>
    <rect x="285" y="434" width="142" height="28" rx="6" fill="#ef6f6c"/>
    <text x="528" y="455" fill="#f3f8fc" text-anchor="end">58</text>
  </g>
  <rect x="612" y="170" width="490" height="405" rx="14" fill="#101c2c" stroke="#1d3048"/>
  <text x="644" y="213" fill="#f3f8fc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Comparison Table</text>
  <g font-family="Inter, Arial, sans-serif" font-size="15">
    <rect x="644" y="244" width="420" height="44" fill="#13243a"/>
    <text x="664" y="272" fill="#8fa5bd" font-weight="700">Project</text>
    <text x="845" y="272" fill="#8fa5bd" font-weight="700">IRR</text>
    <text x="935" y="272" fill="#8fa5bd" font-weight="700">NPV</text>
    <text x="1035" y="272" fill="#8fa5bd" font-weight="700" text-anchor="end">Decision</text>
    <text x="664" y="325" fill="#dbe7f3">Corporate Expansion</text><text x="845" y="325" fill="#28d7e5">14.96%</text><text x="935" y="325" fill="#dbe7f3">$1.71M</text><text x="1035" y="325" fill="#7ee2b8" text-anchor="end">Pass</text>
    <text x="664" y="379" fill="#dbe7f3">Renewable Energy</text><text x="845" y="379" fill="#28d7e5">13.40%</text><text x="935" y="379" fill="#dbe7f3">$1.22M</text><text x="1035" y="379" fill="#7ee2b8" text-anchor="end">Pass</text>
    <text x="664" y="433" fill="#dbe7f3">Real Estate</text><text x="845" y="433" fill="#f5c96b">11.80%</text><text x="935" y="433" fill="#dbe7f3">$0.84M</text><text x="1035" y="433" fill="#7ee2b8" text-anchor="end">Pass</text>
    <text x="664" y="487" fill="#dbe7f3">Acquisition Case</text><text x="845" y="487" fill="#ef6f6c">9.70%</text><text x="935" y="487" fill="#dbe7f3">$0.31M</text><text x="1035" y="487" fill="#f5c96b" text-anchor="end">Review</text>
  </g>
  <rect x="72" y="604" width="1030" height="1" fill="#1d3048"/>
  <text x="72" y="628" fill="#617b97" font-family="Inter, Arial, sans-serif" font-size="14">IRR is not ranked alone; projects are compared using a broader capital-budgeting score.</text>
</svg>