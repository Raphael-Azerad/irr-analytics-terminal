name: Bug report
description: Report an unexpected application or calculation issue.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve IRR Analytics Terminal.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the inputs, assumptions, and steps needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your Python version, operating system, and browser if relevant.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, sample files, or other useful context.
