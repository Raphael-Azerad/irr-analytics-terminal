name: Feature request
description: Suggest an improvement to the analytics or user experience.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What finance workflow or user need should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior and why it would be useful.
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Financial assumptions
      description: Note any calculation methods, assumptions, or edge cases that should be considered.
